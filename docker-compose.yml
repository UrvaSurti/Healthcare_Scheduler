version: '3.8'

services:
  healthcare-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=healthcare-scheduler-jwt-secret-key-2024
    volumes:
      # Mount the data directory to persist appointment/provider data
      - ./src/data:/app/src/data:ro
    restart: unless-stopped
    container_name: healthcare-scheduler

